<!DOCTYPE html>
<html lang="ru" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}DeFi Tier-1 Yields & Advisor{% endblock %}</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Inter', '-apple-system', 'BlinkMacSystemFont', 'Segoe UI', 'Roboto', 'sans-serif'],
                        mono: ['JetBrains Mono', 'ui-monospace', 'SFMono-Regular', 'Menlo', 'monospace']
                    },
                    colors: {
                        space: {
                            950: '#07080b',
                            900: '#0b0d13',
                            850: '#0f121a',
                            800: '#141824',
                            700: '#1c2233',
                            600: '#2b344d',
                        }
                    }
                }
            }
        }
    </script>
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <!-- Chart.js -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
    <style>
        body {
            background-color: #07080b;
            color: #e2e8f0;
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            -webkit-font-smoothing: antialiased;
        }
        .mini-card {
            background-color: #0b0d13;
            border: 1px solid rgba(255, 255, 255, 0.05);
        }
        .mini-card:hover {
            border-color: rgba(255, 255, 255, 0.09);
        }
        /* Custom slim scrollbar */
        ::-webkit-scrollbar {
            width: 4px;
            height: 4px;
        }
        ::-webkit-scrollbar-track {
            background: #07080b;
        }
        ::-webkit-scrollbar-thumb {
            background: #1c2233;
            border-radius: 2px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #2b344d;
        }
    </style>
</head>
<body class="min-h-screen flex flex-col antialiased text-[12px] selection:bg-emerald-500/20 selection:text-emerald-300">
    <!-- Compact Top Navigation Bar (Height ~44px) -->
    <nav class="border-b border-white/[0.06] bg-[#07080b]/90 backdrop-blur-md sticky top-0 z-50 px-3 sm:px-6 py-2">
        <div class="max-w-[1400px] mx-auto flex items-center justify-between">
            <!-- Brand -->
            <div class="flex items-center space-x-3">
                <a href="/" class="flex items-center space-x-2 group">
                    <div class="w-6 h-6 rounded-md bg-emerald-500/10 border border-emerald-500/20 flex items-center justify-center text-emerald-400 group-hover:bg-emerald-500/20 transition-all">
                        <i data-lucide="zap" class="w-3.5 h-3.5"></i>
                    </div>
                    <div class="flex items-center space-x-1.5">
                        <span class="text-xs font-semibold tracking-tight text-white">DeFi Yields</span>
                        <span class="text-[9px] px-1 py-[1px] rounded bg-white/[0.04] text-gray-400 border border-white/[0.06] font-mono">v2.0</span>
                    </div>
                </a>

                <div class="hidden md:flex items-center space-x-2 pl-3 border-l border-white/[0.06] text-[10px] text-gray-400">
                    <span class="w-1.5 h-1.5 rounded-full bg-emerald-400 animate-pulse"></span>
                    <span>15m On-Chain Sync</span>
                </div>
            </div>

            <!-- Nav Tabs & Actions -->
            <div class="flex items-center space-x-1.5">
                <a href="/stables" class="px-2.5 py-1 rounded-md text-[11px] font-medium transition-all {% if active_tab == 'stables' %}bg-emerald-500/15 text-emerald-300 border border-emerald-500/25 shadow-sm{% else %}text-gray-400 hover:text-emerald-300 hover:bg-white/[0.03]{% endif %}">
                    <i data-lucide="coins" class="w-3 h-3 inline mr-1 text-emerald-400"></i>Стейблкоины
                </a>
                <a href="/" class="px-2.5 py-1 rounded-md text-[11px] font-medium transition-all {% if active_tab == 'all' %}bg-white/[0.08] text-white border border-white/[0.1] shadow-sm{% else %}text-gray-400 hover:text-gray-200 hover:bg-white/[0.03]{% endif %}">
                    <i data-lucide="globe" class="w-3 h-3 inline mr-1 text-sky-400"></i>Все активы
                </a>
                <a href="/advisor" class="px-2.5 py-1 rounded-md text-[11px] font-medium transition-all {% if active_tab == 'advisor' %}bg-purple-500/15 text-purple-300 border border-purple-500/25 shadow-sm{% else %}text-gray-400 hover:text-purple-300 hover:bg-white/[0.03]{% endif %}">
                    <i data-lucide="sparkles" class="w-3 h-3 inline mr-1 text-purple-400"></i>AI Советник
                </a>
                <a href="/portfolio" class="px-2.5 py-1 rounded-md text-[11px] font-medium transition-all {% if active_tab == 'portfolio' %}bg-teal-500/15 text-teal-300 border border-teal-500/25 shadow-sm{% else %}text-gray-400 hover:text-teal-300 hover:bg-white/[0.03]{% endif %}" title="Личный кабинет и мониторинг позиций">
                    <i data-lucide="wallet" class="w-3 h-3 inline mr-1 text-teal-400"></i>Портфель
                </a>
                <button onclick="refreshData()" id="refreshBtn" class="px-2.5 py-1 rounded-md text-[11px] font-medium text-emerald-300 hover:text-white bg-emerald-500/10 hover:bg-emerald-500/20 transition-all border border-emerald-500/25 flex items-center ml-1 shadow-sm cursor-pointer" title="Обновить ончейн-данные без сброса фильтров">
                    <i data-lucide="refresh-cw" class="w-3 h-3 mr-1" id="refreshIcon"></i><span id="refreshLabel">Update</span>
                </button>
            </div>
        </div>
    </nav>

    <!-- Main Content Container -->
    <main class="flex-1 max-w-[1400px] w-full mx-auto px-3 sm:px-6 py-4">
        {% block content %}{% endblock %}
    </main>

    <!-- Ultra-Minimal Footer -->
    <footer class="border-t border-white/[0.04] py-3 text-center text-[10px] text-gray-500">
        <div class="max-w-[1400px] mx-auto px-3 flex flex-col sm:flex-row items-center justify-between gap-1.5">
            <div>
                <span class="text-gray-400">DeFi Tier-1 Yield Engine</span> · Open On-Chain Architecture
            </div>
            <div class="flex items-center space-x-3 text-gray-400">
                <span>Auto-Rollup: 30d</span>
                <span>•</span>
                <span>Gas Break-Even Simulator</span>
            </div>
        </div>
    </footer>

    <!-- Init Lucide Icons -->
    <script>
        lucide.createIcons();

        let isRefreshing = false;
        async function refreshData() {
            if (isRefreshing) return;
            isRefreshing = true;

            const getSpinner = () => document.getElementById('refreshIcon') || document.querySelector('#refreshBtn svg');
            const label = document.getElementById('refreshLabel');
            
            const spinner = getSpinner();
            if (spinner) spinner.classList.add('animate-spin');
            if (label) label.innerText = 'Sync...';

            try {
                await fetch('/api/snapshot/refresh', { method: 'POST' });
                if (typeof window.onDashboardDataUpdated === 'function') {
                    await window.onDashboardDataUpdated();
                }
                if (label) label.innerText = 'Обновлено ✓';
                setTimeout(() => { 
                    if (label) label.innerText = 'Update'; 
                }, 2000);
            } catch(e) {
                console.error('Refresh error:', e);
                if (label) label.innerText = 'Ошибка';
                setTimeout(() => { 
                    if (label) label.innerText = 'Update'; 
                }, 2000);
            } finally {
                // Ensure spinning stops immediately
                const finalSpinner = getSpinner();
                if (finalSpinner) finalSpinner.classList.remove('animate-spin');
                isRefreshing = false;
            }
        }

        // Automatic on-chain sync every 15 minutes (900,000 ms)
        setInterval(refreshData, 900000);
    </script>
    {% block scripts %}{% endblock %}
</body>
</html>
