<!DOCTYPE html>
<html lang="ru" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}DeFi Tier-1 Yield & Rebalance Advisor{% endblock %}</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        brand: {
                            50: '#eff6ff',
                            500: '#3b82f6',
                            600: '#2563eb',
                            700: '#1d4ed8',
                        },
                        dark: {
                            bg: '#0B0F19',
                            card: '#111827',
                            border: '#1F2937',
                            hover: '#1E293B'
                        }
                    }
                }
            }
        }
    </script>
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <!-- Chart.js -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <!-- Custom Styles -->
    <style>
        body {
            background-color: #0B0F19;
            color: #F3F4F6;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
        }
        .glass-card {
            background: rgba(17, 24, 39, 0.85);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(31, 41, 55, 0.8);
        }
        .badge-pulse {
            animation: pulse 2s cubic-bezier(0.4, 0, 0.6, 1) infinite;
        }
        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: .5; }
        }
    </style>
</head>
<body class="min-h-screen flex flex-col antialiased">
    <!-- Navigation Bar -->
    <nav class="glass-card sticky top-0 z-50 border-b border-gray-800 px-4 lg:px-8 py-3.5">
        <div class="max-w-7xl mx-auto flex items-center justify-between">
            <div class="flex items-center space-x-3">
                <a href="/" class="flex items-center space-x-2.5">
                    <div class="w-9 h-9 rounded-xl bg-gradient-to-tr from-blue-600 to-emerald-400 flex items-center justify-center shadow-lg shadow-blue-500/20">
                        <i data-lucide="trending-up" class="w-5 h-5 text-white"></i>
                    </div>
                    <div>
                        <span class="text-lg font-bold bg-gradient-to-r from-white via-gray-200 to-gray-400 bg-clip-text text-transparent">DeFi Tier-1</span>
                        <span class="text-xs ml-1 px-1.5 py-0.5 rounded bg-blue-500/20 text-blue-400 border border-blue-500/30">Live On-Chain</span>
                    </div>
                </a>
            </div>

            <!-- Nav Links -->
            <div class="flex items-center space-x-1 sm:space-x-2">
                <a href="/" class="px-3.5 py-1.5 rounded-lg text-sm font-medium transition-all {% if active_tab == 'dashboard' %}bg-blue-600/20 text-blue-400 border border-blue-500/30{% else %}text-gray-400 hover:text-white hover:bg-gray-800{% endif %}">
                    <i data-lucide="layout-grid" class="w-4 h-4 inline-block mr-1.5"></i>Дашборд
                </a>
                <a href="/advisor" class="px-3.5 py-1.5 rounded-lg text-sm font-medium transition-all {% if active_tab == 'advisor' %}bg-emerald-600/20 text-emerald-400 border border-emerald-500/30{% else %}text-gray-400 hover:text-white hover:bg-gray-800{% endif %}">
                    <i data-lucide="sparkles" class="w-4 h-4 inline-block mr-1.5"></i>AI Советник
                </a>
                <button onclick="refreshData()" id="refreshBtn" class="px-3 py-1.5 rounded-lg text-sm font-medium text-gray-400 hover:text-white hover:bg-gray-800 transition-all border border-gray-800 hover:border-gray-700 flex items-center">
                    <i data-lucide="refresh-cw" class="w-4 h-4 mr-1.5" id="refreshIcon"></i><span class="hidden sm:inline">Обновить</span>
                </button>
            </div>
        </div>
    </nav>

    <!-- Main Content Container -->
    <main class="flex-1 max-w-7xl w-full mx-auto px-4 lg:px-8 py-6">
        {% block content %}{% endblock %}
    </main>

    <!-- Footer -->
    <footer class="border-t border-gray-900 py-6 text-center text-xs text-gray-500">
        <div class="max-w-7xl mx-auto px-4 flex flex-col sm:flex-row items-center justify-between space-y-2 sm:space-y-0">
            <div>
                <span>DeFi Yield & Rebalance Advisor © 2026</span> · 
                <span class="text-gray-400">100% Free & Open On-Chain Data</span>
            </div>
            <div class="flex items-center space-x-3 text-gray-400">
                <span>Интервал: 15 мин</span>
                <span>•</span>
                <span>Tier-1 Protocols Only</span>
            </div>
        </div>
    </footer>

    <!-- Init Lucide Icons -->
    <script>
        lucide.createIcons();

        async function refreshData() {
            const btn = document.getElementById('refreshBtn');
            const icon = document.getElementById('refreshIcon');
            icon.classList.add('animate-spin');
            try {
                const res = await fetch('/api/snapshot/refresh', { method: 'POST' });
                if (res.ok) {
                    setTimeout(() => {
                        window.location.reload();
                    }, 2500);
                }
            } catch(e) {
                console.error(e);
                icon.classList.remove('animate-spin');
            }
        }
    </script>
    {% block scripts %}{% endblock %}
</body>
</html>
